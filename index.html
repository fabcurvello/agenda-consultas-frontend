<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema de Agendamento de Consultas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h2 class="mb-0">Sistema de Agendamento de Consultas</h2>
        </div>

        <div class="card-body">
          <form id="formConsulta">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label"> Paciente </label>

                <input
                  type="text"
                  class="form-control"
                  id="paciente"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label"> Especialidade </label>

                <input
                  type="text"
                  class="form-control"
                  id="especialidade"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label"> Médico </label>

                <input type="text" class="form-control" id="medico" required />
              </div>

              <div class="col-md-3 mb-3">
                <label class="form-label"> Data </label>

                <input
                  type="date"
                  class="form-control"
                  id="dataConsulta"
                  required
                />
              </div>

              <div class="col-md-3 mb-3">
                <label class="form-label"> Hora </label>

                <input
                  type="time"
                  class="form-control"
                  id="horaConsulta"
                  required
                />
              </div>
            </div>

            <button class="btn btn-primary" type="submit">
              Agendar Consulta
            </button>
          </form>
        </div>
      </div>

      <div class="card shadow mt-4">
        <div class="card-header">
          <h4 class="mb-0">Consultas Agendadas</h4>
        </div>

        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Paciente</th>
                <th>Especialidade</th>
                <th>Médico</th>
                <th>Data</th>
                <th>Hora</th>
                <th width="120">Ações</th>
              </tr>
            </thead>

            <tbody id="tabelaConsultas"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
